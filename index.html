<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07090d" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="No-Limit Texas Hold'em Sit & Go gegen Computergegner – direkt im Browser, auch auf iPhone und iPad." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Hold'em" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>Hold'em – Texas Hold'em Sit & Go</title>
    <style>
      html, body { background: #07090d; }
      html[data-theme='clean'], html[data-theme='clean'] body { background: #f4f5f7; }
    </style>
    <script>
      // apply the chosen design before the first paint (no dark flash for the light design)
      try {
        if (JSON.parse(localStorage.getItem('holdem.settings.v1') || '{}').theme === 'clean') {
          document.documentElement.dataset.theme = 'clean';
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f4f5f7');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
